<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KICK — вход</title>
<style>
body{margin:0;height:100vh;display:grid;place-items:center;background:#f0f0f2;font:100%/1.45 system-ui,-apple-system,sans-serif;color:#151515}
.box{background:#fff;border:1px solid rgba(0,0,0,.09);border-radius:16px;padding:32px;width:320px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.logo{width:44px;height:44px;border-radius:11px;background:#783CBD;color:#fff;display:grid;place-items:center;font-weight:700;font-size:22px;margin:0 auto 14px}
h1{font-size:19px;text-align:center;margin:0 0 4px}
.sub{font-size:12.5px;color:#6b6b70;text-align:center;margin-bottom:22px}
label{font-size:12px;color:#6b6b70;display:block;margin:12px 0 5px}
input{width:100%;padding:10px 12px;border:1px solid rgba(0,0,0,.12);border-radius:9px;font:inherit;font-size:14px}
input:focus{outline:none;border-color:#783CBD}
button{width:100%;margin-top:20px;background:#783CBD;color:#fff;border:0;border-radius:9px;padding:11px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.err{color:#c2410c;font-size:12.5px;margin-top:12px;text-align:center}
</style>
</head>
<body>
<form class="box" method="post">
  {% csrf_token %}
  <div class="logo">K</div>
  <h1>KICK — панель управления</h1>
  <div class="sub">Вход для сотрудников</div>
  <label>Логин</label>
  <input name="username" autofocus>
  <label>Пароль</label>
  <input name="password" type="password">
  <button type="submit">Войти</button>
  {% if form.errors %}<div class="err">Неверный логин или пароль</div>{% endif %}
</form>
</body>
</html>
